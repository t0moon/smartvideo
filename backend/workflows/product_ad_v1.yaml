# Product Ad Workflow v1
# Workflow for creating brand product advertisement videos
#
# Stage graph (YAML-driven since Phase 2):
#   requirement -> storyboard -> asset_prep -> scene_gen -> video_gen -> stitch -> publish
# Each stage maps 1:1 to a WorkflowRuntime._exec_<stage> handler. Stages with
# pause_for_review: true become a Human-in-the-Loop approval gate. Reordering or
# adding stages here changes pipeline behaviour with zero code changes.

name: product_ad_v1
description: Brand product advertisement video production
version: 1.0.0

stages:
  - id: requirement
    name: Requirement Understanding
    agent: lead
    skill: requirement
    next: storyboard
    pause_for_review: true
    inputs:
      brief: '{{project.brief}}'
    outputs:
      video_spec: 'workflow_state.video_spec'

  - id: storyboard
    name: Storyboard Generation
    agent: lead
    skill: storyboard
    next: asset_prep
    pause_for_review: true
    inputs:
      spec: 'workflow_state.video_spec'
    outputs:
      storyboard: 'workflow_state.storyboard'

  - id: asset_prep
    name: Asset Preparation
    agent: lead
    skill: asset_prep
    next: scene_gen
    pause_for_review: true
    inputs:
      storyboard: 'workflow_state.storyboard'
    outputs:
      assets: 'workflow_state.assets'

  - id: scene_gen
    name: Scene Generation
    agent: lead
    skill: scene
    next: video_gen
    pause_for_review: false
    inputs:
      storyboard: 'workflow_state.storyboard'
    outputs:
      scenes: 'workflow_state.scenes'

  - id: video_gen
    name: Video Clip Generation
    agent: video_provider
    skill: video_prod
    next: stitch
    pause_for_review: true
    inputs:
      scenes: 'workflow_state.scenes'
    outputs:
      clips: 'workflow_state.clips'

  - id: stitch
    name: Video Stitching
    agent: ffmpeg
    skill: stitch
    next: publish
    pause_for_review: false
    inputs:
      clips: 'workflow_state.clips'
    outputs:
      final_video: 'workflow_state.final_video_path'

  - id: publish
    name: Publish Export
    agent: publish
    skill: publish
    next: null
    pause_for_review: false
    inputs:
      final_video: 'workflow_state.final_video_path'
    outputs:
      publish_result: 'workflow_state.publish_result'

hooks:
  after_stage:
    - save_workspace
    - audit_log
  after_pipeline:
    - collect_assets
    - publish_event
