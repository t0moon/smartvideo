 [build-system]
 requires = ["setuptools>=68", "wheel"]
 build-backend = "setuptools.build_meta"
 
 [tool.setuptools.packages.find]
 where = ["."]
 include = ["app*", "shared*", "project*", "workspace*", "context*", "models*", "agents*", "skills*", "tools*", "providers*", "runtime*", "middleware*", "guardrails*", "assets*", "review*", "subagents*", "channels*", "events*", "observability*", "storage*", "workflows*"]
 
 [project]
 name = "smartvideo-platform"
 version = "0.1.0"
 description = "Enterprise AI Video Production Platform (Phase 1 MVP)"
 requires-python = ">=3.11"
 dependencies = [
   "pydantic>=2.0.0",
   "python-dotenv>=1.0.0",
   "httpx>=0.27.0",
   "PyYAML>=6.0",
  "langfuse>=4.0.0",
 ]
 
 [project.optional-dependencies]
 dev = [
   "pytest>=8.0.0",
   "ruff>=0.6.0",
 ]
 openai = [
   "openai>=1.0.0",
  "langfuse>=4.0.0",
 ]
 web = [
   "fastapi>=0.110.0",
   "uvicorn[standard]>=0.27.0",
   "websockets>=12.0",
   "sqlalchemy>=2.0.0",
   "aiosqlite>=0.20.0",
 ]
 all = [
   "smartvideo-platform[dev,openai,web]",
 ]
 
 [project.scripts]
 smartvideo = "app.cli:main"
 
 [tool.ruff]
 line-length = 100
 target-version = "py311"