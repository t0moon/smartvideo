version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8765:8765"
    environment:
      - OPENAI_API_KEY=
      - OPENAI_BASE_URL=
      - OPENAI_MODEL=gpt-4o-mini
      - VIDEO_PROVIDER=placeholder
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
